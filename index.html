<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqlli yordamchi</title>
<style>
:root{--bg:#eaf3f2;--card:#fff;--ink:#0f2a2e;--ln:#cfe0de;--acc:#0e7c86;--bot:#dcebe9;--shirt:#0e7c86;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#09181b;--card:#112529;--ink:#e6f2f1;--ln:#1f3a3f;--bot:#17313a;--shirt:#138892;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
h1{font-size:17px;margin:0}
.ic{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 10px}
#stage{flex:0 0 34vh;min-height:140px;display:flex;justify-content:center;padding:0 10px}
#av{height:100%;width:auto;max-width:100%}
#log{flex:1;min-height:0;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 12px;border-radius:14px;line-height:1.4;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.b{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m a{display:block;margin-top:4px;color:inherit;font-weight:700}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px}
#chips button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:13px}
#f{display:flex;gap:8px;padding:8px 14px 12px}
#q{flex:1;min-width:0;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:22px;padding:11px 14px;font-size:16px}
#f button{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:18px}
#mic.on{background:#d6453d}
#ov{position:fixed;inset:0;background:rgba(5,14,16,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov[hidden]{display:none}
#ov .c{background:var(--card);border-radius:18px;padding:22px;width:min(360px,100%);text-align:center}
#ov p{margin:0 0 4px;font-size:20px;font-weight:700}
#nm{width:100%;margin:12px 0;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;text-align:center}
#go{width:100%;border:0;background:var(--acc);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}
.talk #mouth{animation:tk .2s infinite alternate}
@keyframes tk{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
#arm{transform-box:view-box;transform-origin:144px 204px}
.wave #arm{animation:wv 2.6s ease-in-out}
@keyframes wv{0%,100%{transform:rotate(0)}12%{transform:rotate(-120deg)}25%,50%,75%{transform:rotate(-148deg)}37%,62%,88%{transform:rotate(-112deg)}}
#av{animation:fl 3.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#av,.eye{animation:none}}
</style>
</head>
<body>
<header><h1>Aqlli yordamchi</h1><button class="ic" id="snd" title="Ovozni yoqish / o‘chirish">🔊</button></header>

<div id="stage">
<svg id="av" viewBox="0 0 200 300" role="img" aria-label="Odam shaklidagi yordamchi">
 <path d="M44 300V236Q44 196 88 190H112Q156 196 156 236V300Z" fill="var(--shirt)"/>
 <rect x="86" y="150" width="28" height="42" rx="8" fill="#e2b78f"/>
 <path d="M100 214V300" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
 <path d="M88 189L100 214L80 204Z M112 189L100 214L120 204Z" fill="#f4f7f7"/>
 <circle cx="100" cy="230" r="2.5" fill="#f4f7f7"/><circle cx="100" cy="250" r="2.5" fill="#f4f7f7"/><circle cx="100" cy="270" r="2.5" fill="#f4f7f7"/>
 <line x1="56" y1="204" x2="40" y2="270" stroke="var(--shirt)" stroke-width="17" stroke-linecap="round"/>
 <circle cx="39" cy="274" r="9" fill="#f1c7a0"/>
 <g id="arm"><line x1="144" y1="204" x2="162" y2="270" stroke="var(--shirt)" stroke-width="17" stroke-linecap="round"/><circle cx="163" cy="274" r="9" fill="#f1c7a0"/></g>
 <ellipse cx="52" cy="112" rx="6.5" ry="10" fill="#e9b88f"/><ellipse cx="148" cy="112" rx="6.5" ry="10" fill="#e9b88f"/>
 <circle cx="100" cy="105" r="48" fill="#f1c7a0"/>
 <path d="M53 92Q50 50 100 50Q150 50 147 92Q140 80 100 80Q60 80 53 92Z" fill="#2b2118"/>
 <path d="M58 86L64 58Q100 44 136 58L142 86Q100 76 58 86Z" fill="#14181d"/>
 <path d="M60 80Q100 70 140 80" stroke="#fff" stroke-width="2.5" fill="none" stroke-dasharray="1 5" stroke-linecap="round"/>
 <path d="M100 55l7 9-7 9-7-9z" fill="none" stroke="#fff" stroke-width="2"/>
 <ellipse class="eye" cx="82" cy="110" rx="5" ry="6.5" fill="#1b1b1b"/>
 <ellipse class="eye" cx="118" cy="110" rx="5" ry="6.5" fill="#1b1b1b"/>
 <path d="M71 99Q81 94 93 97M107 97Q119 94 129 99" stroke="#2b2118" stroke-width="4.5" fill="none" stroke-linecap="round"/>
 <path d="M100 113Q95 125 102 127" stroke="#c99671" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 
 <ellipse id="mouth" cx="100" cy="140" rx="11" ry="7" fill="#8a2b2b"/>
</svg>
</div>

<div id="log" aria-live="polite"></div>
<div id="chips"><button>Musiqa qo‘y</button><button>Musiqani o‘chir</button><button>Soat nechchi?</button><button>YouTube’ni och</button><button>Telegram’ni och</button></div>
<form id="f"><input id="q" placeholder="Savolingizni yozing…" autocomplete="off"><button type="button" id="mic" title="Ovoz bilan gapirish">🎤</button><button type="submit" title="Yuborish">➤</button></form>

<div id="ov"><div class="c"><p>Assalomu alaykum!</p><div>Ismingiz nima?</div><input id="nm" placeholder="Ismingizni yozing" autocomplete="given-name" maxlength="30"><button id="go">Boshlash</button></div></div>

<script>
(()=>{
const $=s=>document.querySelector(s),log=$("#log"),av=$("#av"),TTS=window.speechSynthesis;
// Savollarga javob beradigan manzil. Barqaror ishlashi uchun o‘z proxy manzilingizga almashtiring (API kalitni bu yerga yozmang).
const AI_URL="https://text.pollinations.ai/openai";
// Musiqa: mp3 fayllarni repodagi music/ papkasiga qo‘ying va shu yerga yozing. Masalan: [{n:"Qo‘shiq nomi",src:"music/1.mp3"}]
const TRACKS=[];
const SYS="Sen o‘zbek tilidagi do‘stona yordamchisan. Faqat sof o‘zbek tilida (lotin yozuvida) javob ber, rus va ingliz so‘zlarini aralashtirma. Javob qisqa va aniq bo‘lsin (2–4 gap).";
const APPS={youtube:["YouTube","https://www.youtube.com"],telegram:["Telegram","https://web.telegram.org/a/"],instagram:["Instagram","https://www.instagram.com"],facebook:["Facebook","https://www.facebook.com"],whatsapp:["WhatsApp","https://web.whatsapp.com"],tiktok:["TikTok","https://www.tiktok.com"],gmail:["Gmail","https://mail.google.com"],pochta:["Gmail","https://mail.google.com"],xarita:["Xaritalar","https://maps.google.com"],google:["Google","https://www.google.com"],github:["GitHub","https://github.com"],vikipediya:["Vikipediya","https://uz.wikipedia.org"]};
const MO=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const WD=["yakshanba","dushanba","seshanba","chorshanba","payshanba","juma","shanba"];
let who="",muted=false,hist=[],voice=null,ac,mt,au,playing=false,ti=0;
try{who=localStorage.getItem("ism")||""}catch(e){}
const save=()=>{try{localStorage.setItem("ism",who)}catch(e){}};
const norm=s=>s.toLowerCase().replace(/[‘’ʻʼ'`]/g,"").trim();

function add(role,text,link){
  const d=document.createElement("div");d.className="m "+(role==="u"?"u":"b");d.textContent=text;
  if(link){const a=document.createElement("a");a.href=link;a.target="_blank";a.rel="noopener";a.textContent="Ochish ↗";d.append(a)}
  log.append(d);log.scrollTop=log.scrollHeight;
}
const talk=on=>av.classList.toggle("talk",on);
function pick(){const v=TTS.getVoices();voice=v.find(x=>/^uz/i.test(x.lang))||v.find(x=>/^tr/i.test(x.lang))||null}
if(TTS){pick();TTS.onvoiceschanged=pick}
function speak(t){
  if(TTS)TTS.cancel();
  if(muted||!TTS){talk(true);setTimeout(()=>talk(false),Math.min(t.length*55,5000));return}
  const uz=voice&&/^uz/i.test(voice.lang);
  const u=new SpeechSynthesisUtterance(t.replace(/[*#`_>]/g,"").replace(/[‘’ʻʼ]/g,uz?"'":""));
  u.lang=voice?voice.lang:"uz-UZ";if(voice)u.voice=voice;u.rate=.95;u.pitch=.7;
  u.onstart=()=>talk(true);u.onend=u.onerror=()=>talk(false);
  TTS.speak(u);
}

function stopMusic(){playing=false;clearTimeout(mt);if(au){au.pause();au=null}}
function playMusic(){
  stopMusic();playing=true;
  if(TRACKS.length){const t=TRACKS[ti++%TRACKS.length];au=new Audio(t.src);au.onended=playMusic;au.play().catch(()=>{});return "Musiqa yoqildi: "+t.n}
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  const sc=[261.6,293.7,329.6,392,440,523.3,587.3];
  (function tick(){
    if(!playing)return;
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.frequency.value=sc[Math.random()*sc.length|0]*(Math.random()<.25?.5:1);
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.16,n+.05);g.gain.exponentialRampToValueAtTime(.001,n+1.8);
    o.connect(g).connect(ac.destination);o.start(n);o.stop(n+1.9);
    mt=setTimeout(tick,450+Math.random()*500);
  })();
  return "Yoqimli kuy yoqildi. To‘xtatish uchun “musiqani o‘chir” deb yozing.";
}

function launch([n,u]){
  if(u.startsWith("tel:"))setTimeout(()=>{location.href=u},400);else window.open(u,"_blank","noopener");
  return{t:n+" ochilmoqda…",url:u};
}
function cmd(raw){
  const t=norm(raw),has=r=>r.test(t),words=t.split(/\s+/);let m;
  if(has(/ismim nima|ismimni ayt/))return{t:who?"Sizning ismingiz — "+who+".":"Ismingizni hali bilmayman. “Ismim ...” deb yozing."};
  if(m=t.match(/^(?:mening )?ismim\s+(.+)$/)||t.match(/^meni\s+(.+?)\s+deb chaqir/)){who=m[1].replace(/(^|\s)\S/g,c=>c.toUpperCase());save();return{t:"Xo‘p, "+who+"! Endi sizni shunday chaqiraman."}}
  if(has(/^(salom|assalom)/))return{t:"Va alaykum assalom, "+(who||"do‘stim")+"! Qanday yordam bera olaman?"};
  if(has(/soat|vaqt/)&&has(/nech|qancha|nima|hozir/)){const d=new Date(),p=n=>String(n).padStart(2,"0");return{t:"Hozir soat "+p(d.getHours())+":"+p(d.getMinutes())+"."}}
  if(has(/sana|nechanchi (kun|sana)|qaysi kun|hafta kuni/)){const d=new Date();return{t:"Bugun "+d.getDate()+"-"+MO[d.getMonth()]+", "+d.getFullYear()+"-yil, "+WD[d.getDay()]+"."}}
  if(has(/ochir|toxtat|jim bol|stop/)&&has(/musiqa|kuy|qoshiq|qoshig|ovoz|gapirma|stop|jim/)){stopMusic();if(TTS)TTS.cancel();return{t:"Xo‘p, to‘xtatdim."}}
  const app=Object.keys(APPS).find(k=>t.includes(k));
  if(app&&words.length<=5&&has(/\b(och|ochib|oching|kir|kirib|ishga)\b/))return launch(APPS[app]);
  if(has(/musiqa|kuy|qoshiq|qoshig/)&&has(/\b(qoy\w*|yoq\w*|chal\w*|eshit\w*)/)){
    const G=/^(musiqa\w*|kuy\w*|qoshiq\w*|qoshig\w*|qoy\w*|yoq\w*|chal\w*|eshit\w*|bitta|menga|iltimos|bir|biror|yaxshi)$/;
    const q=raw.split(/\s+/).filter(w=>!G.test(norm(w).replace(/[?!.,]/g,""))).join(" ");
    return q?launch(["“"+q+"” YouTube’da","https://www.youtube.com/results?search_query="+encodeURIComponent(q)]):{t:playMusic()};
  }
  if(m=t.match(/(?:qongiroq|telefon)[^\d+]*(\+?\d[\d\s-]{6,})/))return launch(["Qo‘ng‘iroq","tel:"+m[1].replace(/[\s-]/g,"")]);
  if(/^(qidir|izla|google)\b/.test(t)||/\b(qidirib ber|izlab ber)$/.test(t)){const q=raw.replace(/qidirib ber|izlab ber|qidir|izla|google/gi,"").trim();if(q)return launch(["Google qidiruvi","https://www.google.com/search?q="+encodeURIComponent(q)])}
  return null;
}

async function ask(q){
  hist.push({role:"user",content:q});hist=hist.slice(-8);
  const c=new AbortController(),to=setTimeout(()=>c.abort(),25000);
  try{
    const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,body:JSON.stringify({model:"openai",messages:[{role:"system",content:SYS+(who?" Foydalanuvchining ismi: "+who+".":"")},...hist]})});
    const a=(await r.json()).choices[0].message.content.trim();
    hist.push({role:"assistant",content:a});return a;
  }catch(e){return "Kechirasiz, hozir javob ola olmadim. Internetni tekshirib, qaytadan urinib ko‘ring."}
  finally{clearTimeout(to)}
}
async function send(raw){
  raw=raw.trim();if(!raw)return;
  add("u",raw);
  const c=cmd(raw);
  if(c){add("b",c.t,c.url);speak(c.t);return}
  add("b","O‘ylayapman…");const el=log.lastElementChild;
  const a=await ask(raw);el.textContent=a;log.scrollTop=log.scrollHeight;speak(a);
}

$("#f").onsubmit=e=>{e.preventDefault();const i=$("#q"),v=i.value;i.value="";send(v)};
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>send(b.textContent));
$("#snd").onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?"🔇":"🔊";if(muted&&TTS)TTS.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$("#mic");
if(SR)mic.onclick=()=>{const r=new SR();r.lang="uz-UZ";r.onresult=e=>send(e.results[0][0].transcript);r.onend=r.onerror=()=>mic.classList.remove("on");mic.classList.add("on");try{r.start()}catch(e){}};
else mic.hidden=true;

$("#nm").value=who;
$("#nm").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#go").onclick=()=>{
  const v=$("#nm").value.trim();if(v){who=v;save()}
  $("#ov").hidden=true;
  av.classList.add("wave");setTimeout(()=>av.classList.remove("wave"),2700);
  const h=new Date().getHours(),g=h<11?"Xayrli tong":h<18?"Xayrli kun":"Xayrli kech";
  const t="Assalomu alaykum, "+(who||"do‘stim")+"! "+g+"! Men sizning yordamchingizman. Savol bering, musiqa qo‘yaman yoki ilovalarni ochaman.";
  add("b",t);speak(t);
};
})();
</script>
</body>
</html>
